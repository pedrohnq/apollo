name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  testes:
    runs-on: ubuntu-latest

    # O CI precisa de um Postgres real. Não usamos o docker-compose.yml aqui:
    # "services" sobe o container direto no runner e o Actions gerencia rede,
    # healthcheck e limpeza. Reaproveitar o compose exigiria build da imagem
    # da aplicação a cada push, o que é lento e desnecessário para rodar testes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meuprojeto
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          # Publicamos no host do runner porque os steps rodam fora de container,
          # e por isso o host na DATABASE_URL é "localhost", não "db".
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/meuprojeto
      # Segredo de teste: não é o de produção, e não precisa ser secreto.
      DJANGO_SECRET_KEY: chave-apenas-para-ci

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Cacheia os pacotes entre execuções, cortando a etapa mais lenta.
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verificar migrações pendentes
        # Falha se alguém alterou um model e esqueceu de rodar makemigrations.
        # Esse esquecimento não quebra os testes (o Django cria o schema a
        # partir dos models), mas quebra o deploy, quando o migrate roda contra
        # um banco existente. Pegar isso aqui custa dois segundos.
        run: python manage.py makemigrations --check --dry-run

      - name: Checagem de sanidade do Django
        run: python manage.py check

      - name: Rodar os testes com coverage
        run: coverage run manage.py test financeiro -v 2

      - name: Publicar cobertura no resumo do Actions
        # Tudo que é escrito em $GITHUB_STEP_SUMMARY vira markdown renderizado
        # na própria página da execução — sem download, sem artefato.
        #
        # "always" para que a tabela apareça mesmo se os testes falharem.
        #
        # O --fail-under=0 em cada chamada é essencial: sem ele, o coverage sai
        # com status 2 quando a cobertura está abaixo do mínimo, e o step aborta
        # na primeira chamada — engolindo justamente o relatório que explica a
        # falha. Quem reprova a build é o step seguinte, não este.
        if: always()
        run: |
          {
            echo "## Cobertura de testes"
            echo ""
            echo "**Total: $(coverage report --format=total --fail-under=0)%**"
            echo ""
            coverage report --format=markdown --fail-under=0
            echo ""
            echo "<details><summary>Linhas não cobertas</summary>"
            echo ""
            echo '```'
            coverage report -m --skip-covered --fail-under=0
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar cobertura mínima
        # O gate, separado do relatório: falha abaixo do fail_under do
        # .coveragerc (90%). Fica por último para que a tabela já esteja
        # publicada no resumo quando a build quebrar.
        run: coverage report